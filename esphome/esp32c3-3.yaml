substitutions:
  devicename: "esp32c3-3"
  readable_devicename: ESP32C3 3

esphome:
  name: $devicename
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-c3-devkitm-1 # AI esp-c3-12f
  variant: ESP32C3
  framework:
    type: esp-idf
    version: recommended
    # Custom sdkconfig options
    sdkconfig_options:
      CONFIG_COMPILER_OPTIMIZATION_SIZE: y

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: ${readable_devicename} Hotspot
    password: !secret ap_password

# captive_portal:

# Enable logging
logger:

api:
  encryption:
    key: atr73+3pDVEPlHZDwTK9I6p4PEPblYXklZWuxd/WLL0=

ota:
  - platform: esphome
    password: !secret ota_password

output:
  - platform: ledc
    id: pwm_fan
    pin: 
      number: 4
      inverted: false
      mode: OUTPUT
    frequency: 25000 Hz
    min_power: 5%
    zero_means_zero: true

fan:
  - platform: speed
    output: pwm_fan
    name: ${readable_devicename} Fan
    speed_count: 100
    restore_mode: NO_RESTORE

