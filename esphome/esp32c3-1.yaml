substitutions:
  devicename: "esp32c3-1"
  readable_devicename: ESP32C3 1

esphome:
  name: $devicename
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-c3-devkitm-1 # seeed_xiao_esp32c3
  variant: esp32c3
  framework:
    type: esp-idf
    version: recommended
    # Custom sdkconfig options
    sdkconfig_options:
      CONFIG_COMPILER_OPTIMIZATION_SIZE: y

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: ${readable_devicename} Hotspot
    password: !secret ap_password

# captive_portal:

# Enable logging
logger:

api:
  encryption:
    key: zj2Ot3FvM8XMn5ykbA4bfPUy7117jKvLBUBo/XjG0DI=

ota:
  - platform: esphome
    password: !secret ota_password

binary_sensor:
  - platform: status
    name: ${readable_devicename} Status
  - platform: gpio
    pin:
      number: 9
      inverted: True
      mode: INPUT_PULLUP
    name: ${readable_devicename} Button
    filters:
      - delayed_on: 50ms
      - delayed_off: 10ms
    on_press:
      - switch.toggle:
          id: relay_1

sensor:
  - platform: wifi_signal
    name: ${readable_devicename} Wifi Signal
    update_interval: 60s

switch:
  - platform: gpio
    name: ${readable_devicename} Relay
    id: relay_1
    pin:
      number: 10
      inverted: true
    restore_mode: ALWAYS_ON
