esphome:
  name: ${devicename}

esp8266:
  board: esp01_1m
  framework:
    version: recommended
  # includes:
  #   - om100.h
  # on_boot:
  #   then:
  #     - light.turn_on:
  #         id: $devicename
  #         brightness: 100%
  #         white: 1.0
  #         color_temperature: 259 mireds 

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  use_address: $lan_address
  reboot_timeout: 60min

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: ${readable_devicename} Hotspot
    password: !secret ap_password

captive_portal:

# Enable logging
logger:

api:
  encryption:
    key: CynPPMNufq90kYZDmwMKDLMwSEIFDNiDVCaNeSRi33k=
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

# Define output pins
output:
  - platform: esp8266_pwm
    id: output_red
    pin: GPIO4
    min_power: 0.0005
    zero_means_zero: true
  - platform: esp8266_pwm
    id: output_green
    pin: GPIO12
    min_power: 0.0005
    zero_means_zero: true
  - platform: esp8266_pwm
    id: output_blue
    pin: GPIO14
    min_power: 0.0005
    zero_means_zero: true
  - platform: esp8266_pwm
    id: output_white_brightness
    pin: GPIO5
    min_power: 0.0005
    zero_means_zero: true
  - platform: esp8266_pwm
    id: output_white_temperature
    pin: GPIO13
    inverted: true

# light:
#   - platform: custom
#     lambda: |-
#       auto light_out = new OM100(id(output_red), id(output_green), id(output_blue), id(output_white_temperature), id(output_white_brightness));
#       App.register_component(light_out);
#       return {light_out};
#     lights:
#       - name: $devicename
#         id: $devicename
#         effects:
#           - random:
#           - strobe:
#           - flicker:
light:
  - platform: rgbct
    name: $devicename
    red: output_red
    green: output_green
    blue: output_blue
    color_temperature: output_white_temperature
    white_brightness: output_white_brightness
    cold_white_color_temperature: 154 mireds
    warm_white_color_temperature: 370 mireds
    color_interlock: true
    effects:
      - random:
      - strobe:
      - flicker:

sensor:
  - platform: wifi_signal
    name: ${readable_devicename} Wifi Signal
    update_interval: 60s
