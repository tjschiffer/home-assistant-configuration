substitutions:
  devicename: om100-1
  readable_devicename: OM100 1
  lan_address: om100-1.lan

esphome:
  name: $devicename
  # platformio_options:
  #   board_build.flash_mode: dio

esp32:
  board: esp32-c3-devkitm-1 
  variant: esp32c3
  framework:
    type: esp-idf
    version: recommended

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  use_address: ${lan_address}

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: ${readable_devicename} Hotspot
    password: !secret ap_password

# captive_portal:

# Enable logging
logger:

api:
  encryption:
    key: CynPPMNufq90kYZDmwMKDLMwSEIFDNiDVCaNeSRi33k=

ota:
  - platform: esphome
    password: !secret ota_password

# Define output pins
output:
  - platform: ledc
    id: output_red
    pin: GPIO18
    min_power: 0.0005
    zero_means_zero: true
  - platform: ledc
    id: output_green
    pin: GPIO4
    min_power: 0.0005
    zero_means_zero: true
  - platform: ledc
    id: output_blue
    pin: GPIO3
    min_power: 0.0005
    zero_means_zero: true
  - platform: ledc
    id: output_white_brightness
    pin: GPIO19
    min_power: 0.0005
    zero_means_zero: true
  - platform: ledc
    id: output_white_temperature
    pin: GPIO5
    inverted: true

light:
  - platform: rgbct
    name: $devicename
    red: output_red
    green: output_green
    blue: output_blue
    color_temperature: output_white_temperature
    white_brightness: output_white_brightness
    cold_white_color_temperature: 154 mireds
    warm_white_color_temperature: 370 mireds
    color_interlock: true
    effects:
      - random:
      - strobe:
      - flicker:

sensor:
  - platform: wifi_signal
    name: ${readable_devicename} Wifi Signal
    update_interval: 60s
