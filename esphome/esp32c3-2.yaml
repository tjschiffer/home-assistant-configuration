substitutions:
  devicename: "esp32c3-2"
  readable_devicename: ESP32C3 2

esphome:
  name: $devicename
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: seeed_xiao_esp32c3
  variant: esp32c3
  framework:
    type: esp-idf
    version: recommended
    # Custom sdkconfig options
    sdkconfig_options:
      CONFIG_COMPILER_OPTIMIZATION_SIZE: y

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: ${readable_devicename} Hotspot
    password: !secret ap_password

# captive_portal:

# Enable logging
logger:

api:
  encryption:
    key: atr73+3pDVEPlHZDwTK9I6p4PEPblYXklZWuxd/WLL0=

ota:
  - platform: esphome
    password: !secret ota_password

# binary_sensor:
#   - platform: status
#     name: ${readable_devicename} Status
#   - platform: gpio
#     pin:
#       number: 10
#       inverted: True
#       mode: INPUT_PULLUP
#     name: ${readable_devicename} Button
#     filters:
#       - delayed_on: 10ms
#       - delayed_off: 10ms

sensor:
  - platform: wifi_signal
    name: ${readable_devicename} Wifi Signal
    update_interval: 60s

output:
  - platform: ledc
    id: pwm_fan
    pin: 
      number: 10
      inverted: false
      mode: OUTPUT
    frequency: 25000 Hz
    min_power: 5%

fan:
  - platform: speed
    output: pwm_fan
    name: ${readable_devicename} Fan
    speed_count: 100

