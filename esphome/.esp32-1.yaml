substitutions:
  devicename: esp32-1
  readable_devicename: ESP32 1

esphome:
  name: $devicename
  platform: ESP32
  board: nodemcu-32s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  use_address: esp32-1.lan

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: ${readable_devicename} Hotspot
    password: !secret ap_password

captive_portal:

# Enable logging
logger:

api:
  password: !secret api_password

ota:
  password: !secret ota_password

status_led:
  pin: GPIO2

binary_sensor:
  - platform: gpio
    pin:
      number: 13
      inverted: True
      mode: INPUT_PULLUP
    name: "Living Room Hall Switch"
    filters:
      - delayed_on: 50ms
      - delayed_off: 10ms
