# Sonoff Mini R4
esphome:
  name: sonoff-minir4-${device_number}

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  reboot_timeout: 60min
  use_address: sonoff-minir4-${device_number}.lan

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: SMiniR4 ${device_number} Hotspot
    password: !secret ap_password

captive_portal:

logger:

api:
  encryption:
    key: CynPPMNufq90kYZDmwMKDLMwSEIFDNiDVCaNeSRi33k=
  id: api_server
  batch_delay: 0ms # Disable batching to ensure quick state changes are sent

ota:
  - platform: esphome
    password: !secret ota_password

sensor:
  - platform: wifi_signal
    name: Sonoff MiniR4 ${device_number} Wifi Signal
    update_interval: 90s
    entity_category: "diagnostic"

status_led:
  pin:
    number: GPIO19
    inverted: true

switch:
  - platform: gpio
    id: sonoff_minir4_relay
    name: Sonoff Mini R4 ${device_number} Relay
    pin:
      number: GPIO26
      inverted: false

binary_sensor:
  - platform: gpio
    internal: true
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    name:  Sonoff Mini R4 ${device_number} Button
    on_click:
      max_length: 500ms
      then:
        - switch.toggle: sonoff_minir4_relay
  - platform: gpio
    pin:
      number: GPIO27
      mode: INPUT_PULLUP
      inverted: true
    name: Sonoff Mini R4 ${device_number} Switch
    on_press:
      then:
        - script.execute: switch_press
    on_click:
      min_length: 1s
      max_length: 5s
      then:
        - switch.toggle: sonoff_minir4_relay
  - platform: status
    name:  Sonoff Mini R4 ${device_number} Status
