esphome:
  name: $devicename
  platform: ESP8266
  board: esp01_1m
  # includes:
  #   - sb50.h
  on_boot:
    then:
      - light.turn_on:
          id: light1
          brightness: 100%
          white: 1.0
          color_temperature: 259 mireds 

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  reboot_timeout: 0s

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: ${readable_devicename} Hotspot
    password: !secret ap_password

captive_portal:

logger:
  # Disable logging to serial
  baud_rate: 0

api:
  encryption:
    key: !secret encryption_key
  reboot_timeout: 0s

ota:
  password: !secret ota_password

output:
  - platform: esp8266_pwm
    id: output_red
    pin: GPIO4
    min_power: 0.0005
    zero_means_zero: true
  - platform: esp8266_pwm
    id: output_green
    pin: GPIO12
    min_power: 0.0005
    zero_means_zero: true
  - platform: esp8266_pwm
    id: output_blue
    pin: GPIO14
    min_power: 0.0005
    zero_means_zero: true
  - platform: esp8266_pwm
    id: output_warm_white
    pin: GPIO13
    min_power: 0.0005
    zero_means_zero: true
  - platform: esp8266_pwm
    id: output_cold_white
    pin: GPIO5
    min_power: 0.0005
    zero_means_zero: true

light:
  # - platform: custom
  #   lambda: |-
  #     auto light_out = new SB50(id(output_red), id(output_green), id(output_blue), id(output_warm_white), id(output_cold_white));
  #     App.register_component(light_out);
  #     return {light_out};
  #   lights:
  #     - name: $devicename
  #       id: $devicename
  #       effects:
  #         - random:
  #         - strobe:
  #         - flicker:
  - platform: rgbww
    name: $devicename
    id: light1
    red: output_red
    green: output_green
    blue: output_blue
    warm_white: output_warm_white
    cold_white: output_cold_white
    cold_white_color_temperature: 6200 K
    warm_white_color_temperature: 2800 K
    constant_brightness: true
    color_interlock: true # avoids simultaneous RGB and W/W
    effects:
      - random:
      - strobe:
      - flicker:

sensor:
  - platform: wifi_signal
    name: ${readable_devicename} Wifi Signal
    update_interval: 60s