substitutions:
  devicename: esp32-2
  readable_devicename: ESP32 2

esphome:
  name: $devicename
  platform: ESP32
  board: nodemcu-32s
#  on_boot:
#    then:
#      - output.turn_on: gpio_d13

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: ${readable_devicename} Hotspot
    password: !secret ap_password

captive_portal:

# Enable logging
logger:

api:
  encryption:
    key: EOHZKzXUOohrYnOpQoPUNAG5JoodS+4hX2XKgtlWmOo=

ota:
  password: !secret ota_password

status_led:
  pin: 2

output:
  - platform: gpio
    pin: 13
    id: gpio_d13
    # inverted: true

i2c:
  - id: bus_a
    sda: 21
    scl: 22
    scan: true
  - id: bus_b
    sda: 26
    scl: 27
    scan: true

sensor:
  - platform: wifi_signal
    name: ${readable_devicename} Wifi Signal
    update_interval: 60s
  - platform: sgp4x
    i2c_id: bus_a
    voc:
      name: ${readable_devicename} VOC Index
    nox:
      name: ${readable_devicename} NOx Index
    compensation:
      humidity_source: bme280_humidity
      temperature_source: bme280_temperature
  - platform: bme280_i2c
    i2c_id: bus_b
    temperature:
      name: ${readable_devicename} BME280 Temperature
      id: bme280_temperature
    pressure:
      name: ${readable_devicename} BME280 Pressure
      id: bme280_pressure
    humidity:
      name: ${readable_devicename} BME280 Relative Humidity
      id: bme280_humidity
    address: 0x76
