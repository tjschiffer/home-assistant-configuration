# Sonoff S31
esphome:
  name: sonoff-s31-${device_number}

esp8266:
  board: esp01_1m

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  reboot_timeout: 60min

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: S31 ${device_number} Hotspot
    password: !secret ap_password

captive_portal:

logger:
  baud_rate: 0  # (UART logging interferes with cse7766)

api:
  encryption: 
    key: !secret encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

uart: # Needed for cse7766
  rx_pin: RX
  baud_rate: 4800
  parity: EVEN

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: True
    name:  Sonoff S31 ${device_number} Button
    on_click:
      max_length: 500ms
      then:
        - switch.toggle: s31_relay
  - platform: status
    name:  Sonoff S31 ${device_number} Status

sensor:
  - platform: wifi_signal
    name: Sonoff S31 ${device_number} Wifi Signal dB
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"

  - platform: copy # Reports the WiFi signal strength in %
    source_id: wifi_signal_db
    name: Sonoff S31 ${device_number} Wifi Signal Percent
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
    entity_category: "diagnostic"

  - platform: cse7766
    current:
      name: Sonoff S31 ${device_number} Current
      accuracy_decimals: 1
    voltage:
      name: Sonoff S31 ${device_number} Voltage
      accuracy_decimals: 1
    power:
      name: Sonoff S31 ${device_number} Power
      accuracy_decimals: 1

status_led:
  pin:
    number: GPIO13
    inverted: True

switch:
  - platform: gpio
    id: s31_relay
    pin: GPIO12
    name: Sonoff S31 ${device_number} Relay
