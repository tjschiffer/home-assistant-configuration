# Sonoff Mini
esphome:
  name: sonoff-mini-${device_number}

esp8266:
  board: esp8285
  framework:
    version: recommended

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  reboot_timeout: 60min
  use_address: sonoff-mini-${device_number}.lan

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: SMini ${device_number} Hotspot
    password: !secret ap_password

captive_portal:

logger:

api:
  encryption:
    key: CynPPMNufq90kYZDmwMKDLMwSEIFDNiDVCaNeSRi33k=
  reboot_timeout: 0s # used in lamdas
  id: api_server
  batch_delay: 0ms # Disable batching to ensure quick state changes are sent

ota:
  - platform: esphome
    password: !secret ota_password

sensor:
  - platform: wifi_signal
    name: Sonoff Mini ${device_number} Wifi Signal
    update_interval: 60s

status_led:
  pin:
    number: GPIO13
    inverted: true

switch:
  - platform: gpio
    id: sonoff_mini_relay
    pin: GPIO12
    name: Sonoff Mini ${device_number} Relay
  - platform: restart
    name: Sonoff Mini ${device_number} Restart
    id: sonoff_mini_reboot
